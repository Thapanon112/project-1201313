<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกิดข้อผิดพลาด</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <h1>😵 เกิดข้อผิดพลาด</h1>
                        <div class="alert alert-danger">
                            <h4 th:if="${statusCode}" th:text="'รหัสข้อผิดพลาด: ' + ${statusCode}">รหัสข้อผิดพลาด: 500</h4>
                            <p th:if="${errorMessage}" th:text="${errorMessage}">ข้อความข้อผิดพลาด</p>
                        </div>
                        <a href="/admin" class="btn btn-primary">กลับไปหน้า Admin</a>
                        <a href="/" class="btn btn-secondary">ไปหน้าแรก</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
