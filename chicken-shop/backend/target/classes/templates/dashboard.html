<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ด - ร้านไก่สด</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">🐔 ร้านไก่สด - Admin</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>แดชบอร์ดระบบจัดการร้าน</h1>
        
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5>จำนวนสินค้า</h5>
                        <h2 th:text="${totalProducts}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5>คำสั่งซื้อ</h5>
                        <h2 th:text="${totalOrders}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5>รายได้</h5>
                        <h2 th:text="${totalRevenue} + ' บาท'">0 บาท</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5>เมนูการจัดการ</h5>
                        <div class="d-grid gap-2 d-md-block">
                            <a href="/admin/products" class="btn btn-primary">จัดการสินค้า</a>
                            <a href="/admin/orders" class="btn btn-success">จัดการคำสั่งซื้อ</a>
                            <a href="/api/chickens" class="btn btn-info" target="_blank">ดู API สินค้า</a>
                            <a href="/" class="btn btn-secondary" target="_blank">ไปหน้าร้าน</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
