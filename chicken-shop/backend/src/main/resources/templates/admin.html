<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสินค้า - ร้านไก่สด</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">🐔 ร้านไก่สด - จัดการสินค้า</a>
            <a href="/admin" class="btn btn-light">กลับไปแดชบอร์ด</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>จัดการสินค้า</h1>
        
        <div class="alert alert-info">
            <strong>ระบบจัดการสินค้าพร้อมใช้งาน!</strong> สามารถเพิ่ม/แก้ไข/ลบ สินค้าได้
        </div>

        <div class="card">
            <div class="card-body">
                <h5>สินค้าในระบบ</h5>
                <div th:if="${chickens.empty}">
                    <p class="text-muted">ยังไม่มีสินค้าในระบบ</p>
                </div>
                <div th:unless="${chickens.empty}">
                    <div th:each="chicken : ${chickens}" class="card mb-2">
                        <div class="card-body">
                            <h6 th:text="${chicken.name}">ชื่อสินค้า</h6>
                            <p class="mb-1" th:text="${chicken.type}">ประเภท</p>
                            <p class="mb-1" th:text="${chicken.price} + ' บาท'">ราคา</p>
                            <p class="mb-1" th:text="${chicken.stock} + ' ตัว'">สต็อก</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/admin" class="btn btn-secondary">กลับไปแดชบอร์ด</a>
        </div>
    </div>
</body>
</html>
