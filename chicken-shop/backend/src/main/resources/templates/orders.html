<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการคำสั่งซื้อ - ร้านไก่สด</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">🐔 ร้านไก่สด - จัดการคำสั่งซื้อ</a>
            <a href="/admin" class="btn btn-light">กลับไปแดชบอร์ด</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>จัดการคำสั่งซื้อ</h1>
        
        <div class="alert alert-info">
            <strong>ระบบจัดการคำสั่งซื้อ!</strong> ดูและอัพเดตสถานะคำสั่งซื้อ
        </div>

        <div class="card">
            <div class="card-body">
                <h5>คำสั่งซื้อทั้งหมด</h5>
                <div th:if="${orders.empty}">
                    <p class="text-muted">ยังไม่มีคำสั่งซื้อ</p>
                </div>
                <div th:unless="${orders.empty}">
                    <div th:each="order : ${orders}" class="card mb-3">
                        <div class="card-body">
                            <h6 th:text="'คำสั่งซื้อ #' + ${order.id}">คำสั่งซื้อ</h6>
                            <p class="mb-1" th:text="'ลูกค้า: ' + ${order.customerName}">ลูกค้า</p>
                            <p class="mb-1" th:text="'ยอดรวม: ' + ${order.totalAmount} + ' บาท'">ยอดรวม</p>
                            <p class="mb-1" th:text="'สถานะ: ' + ${order.status}">สถานะ</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/admin" class="btn btn-secondary">กลับไปแดชบอร์ด</a>
        </div>
    </div>
</body>
</html>
